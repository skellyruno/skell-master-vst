name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]

# During rapid UI/DSP iterations, do not waste Windows runners compiling
# superseded snapshots. Always compile and publish the most recent commit.
concurrency:
  group: skell-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test mastering DSP
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing' }
          Compress-Archive -Path $plugin.FullName -DestinationPath SkellPlugin-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: SkellPlugin-Windows-VST3
          path: SkellPlugin-Windows-VST3.zip
          if-no-files-found: error
