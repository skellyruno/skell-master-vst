name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    # Validate this active DSP development branch without screenshot workflows.
    branches: [main, 'dsp/true-peak-ceiling-diagnostics-20261114']
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - 'tools/normalize_vst3_moduleinfo.py'

# During rapid UI/DSP iterations, do not waste Windows runners compiling
# superseded snapshots. Always compile and publish the most recent commit.
concurrency:
  group: skell-master-${{ github.ref }}
  # Only supersede outdated PR checks. Preserve main, manually dispatched,
  # release and production builds even when new commits arrive.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Validate VST3 metadata as strict JSON
        shell: pwsh
        run: |
          python tools/normalize_vst3_moduleinfo.py --self-test
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing before metadata validation' }
          $metadata = Join-Path $plugin.FullName 'Contents/Resources/moduleinfo.json'
          if (-not (Test-Path $metadata)) { throw 'VST3 moduleinfo.json missing' }
          python tools/normalize_vst3_moduleinfo.py "$metadata"
      # Preserve DSP and JUCE interaction tests; no screenshot artifact uploads.
      - name: Test mastering DSP
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing' }
          Compress-Archive -Path $plugin.FullName -DestinationPath SkellPlugin-Windows-VST3.zip
      - uses: actions/upload-artifact@v6
        with:
          retention-days: 14
          name: SkellPlugin-Windows-VST3
          path: SkellPlugin-Windows-VST3.zip
          if-no-files-found: error
