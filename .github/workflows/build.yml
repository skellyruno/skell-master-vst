name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - 'tools/normalize_vst3_moduleinfo.py'
      - 'AGENTS.md'

# During rapid UI/DSP iterations, do not waste Windows runners compiling
# superseded snapshots. Always compile and publish the most recent commit.
concurrency:
  group: skell-master-${{ github.ref }}
  # Do not cancel main or manual builds; supersede only old PR checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Enforce Windows VST3-only target
        run: python tests/test_release_configuration.py
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      # Keep normal DSP/JUCE regression checks; no hosted UI screenshot uploads.
      - name: Test mastering DSP and JUCE UI
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Package one flat Windows VST3 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundles = @(Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Where-Object { $_.FullName -match '[\\/]Release[\\/]' -and $_.Name -eq 'Skelly Master.vst3' })
          if ($bundles.Count -ne 1) { throw "Expected exactly one Release Skelly Master.vst3 bundle; found $($bundles.Count)" }
          $plugin = $bundles[0]
          $binary = Join-Path $plugin.FullName 'Contents/x86_64-win/Skelly Master.vst3'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Windows VST3 module missing: $binary" }
          $bytes = [System.IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid Windows PE DOS signature' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0x40 -or $peOffset -gt ($bytes.Length - 24) -or
              [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE" + [char]0 + [char]0) {
            throw 'Invalid Windows PE signature'
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "Expected AMD64 PE machine, got $machine" }
          $info = Join-Path $plugin.FullName 'Contents/Resources/moduleinfo.json'
          if (-not (Test-Path -LiteralPath $info -PathType Leaf)) { throw 'VST3 moduleinfo.json is required' }
          python tools/normalize_vst3_moduleinfo.py --self-test
          python tools/normalize_vst3_moduleinfo.py "$info"
          $metadata = Get-Content -LiteralPath $info -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($metadata.Name -ne 'Skelly Master') { throw "Unexpected VST3 product name: $($metadata.Name)" }
          if ([string]::IsNullOrWhiteSpace([string]$metadata.Version) -or [string]$metadata.Version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid VST3 semantic version: $($metadata.Version)"
          }
          if ($metadata.'Factory Info'.Vendor -ne 'Skelly Audio') { throw 'Unexpected VST3 vendor identity' }
          $classes = @($metadata.Classes)
          if ($classes.Count -lt 1) { throw 'VST3 metadata contains no classes' }
          $ids = @($classes | ForEach-Object { [string]$_.CID })
          if (@($ids | Sort-Object -Unique).Count -ne $ids.Count) { throw 'Duplicate VST3 class IDs' }
          foreach ($id in $ids) {
            if ($id -notmatch '^[0-9A-Fa-f]{32}$') { throw "Invalid VST3 CID: $id" }
          }

          $binaryHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadataHash = (Get-FileHash -LiteralPath $info -Algorithm SHA256).Hash.ToLowerInvariant()
          $stage = Join-Path $PWD 'release-package'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $plugin.FullName -Destination (Join-Path $stage 'Skelly Master.vst3') -Recurse

          $manifest = [ordered]@{
            schema_version = 1
            product = 'Skelly Master'
            version = [string]$metadata.Version
            vendor = [string]$metadata.'Factory Info'.Vendor
            format = 'VST3'
            platform = 'windows-x64'
            source_commit = $env:SOURCE_COMMIT
            ci_checkout_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            binary_sha256 = $binaryHash
            moduleinfo_sha256 = $metadataHash
            package_status = 'preview-only'
            release_blockers = @(
              'FL Studio scan, automation, project save/reopen and host compatibility are not yet accepted',
              'Real user-music VST3 A/B and listening approval are pending',
              'Vendor URL and support email are not configured'
            )
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $stage 'build-info.json') -Encoding utf8
          @(
            "$binaryHash  Skelly Master.vst3/Contents/x86_64-win/Skelly Master.vst3"
            "$metadataHash  Skelly Master.vst3/Contents/Resources/moduleinfo.json"
          ) | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          Write-Host "Staged one flat VST3 bundle; binary SHA256: $binaryHash"
          Get-ChildItem -LiteralPath $stage -Force | Select-Object Name,Length,Mode | Format-Table -AutoSize
      - uses: actions/upload-artifact@v6
        with:
          retention-days: 14
          name: SkellMaster-Windows-VST3
          path: release-package/
          if-no-files-found: error
