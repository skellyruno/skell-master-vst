name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    # Validate this active DSP development branch without screenshot workflows.
    branches: [main, 'dsp/true-peak-ceiling-diagnostics-20261114']
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - 'tools/normalize_vst3_moduleinfo.py'
      - 'tools/render_deuce_master_reference.ps1'
      - 'tools/render_deuce_master_reference.sh'

# During rapid UI/DSP iterations, do not waste Windows runners compiling
# superseded snapshots. Always compile and publish the most recent commit.
concurrency:
  group: skell-master-${{ github.ref }}
  # Only supersede outdated PR checks. Preserve main, manually dispatched,
  # release and production builds even when new commits arrive.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Validate VST3 metadata as strict JSON
        shell: pwsh
        run: |
          python tools/normalize_vst3_moduleinfo.py --self-test
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing before metadata validation' }
          $metadata = Join-Path $plugin.FullName 'Contents/Resources/moduleinfo.json'
          if (-not (Test-Path $metadata)) { throw 'VST3 moduleinfo.json missing' }
          python tools/normalize_vst3_moduleinfo.py "$metadata"
      # Preserve DSP and JUCE interaction tests; no screenshot artifact uploads.
      - name: Test mastering DSP
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Smoke-test external WAV render path
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          $runner = Get-ChildItem -Path build -File -Recurse -Filter 'SkellyVST3HostAudioTests.exe' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing for WAV render smoke test' }
          if (-not $runner) { throw 'VST3 host render executable missing' }
          $inputWavPath = Join-Path $env:RUNNER_TEMP 'skell-master-render-fixture.wav'
          $outputWavPath = Join-Path $env:RUNNER_TEMP 'skell-master-render-fixture-output.wav'
          $overrideWavPath = Join-Path $env:RUNNER_TEMP 'skell-master-render-fixture-override.wav'
          @'
          import math, struct, sys, wave
          path = sys.argv[1]
          rate = 44100
          with wave.open(path, "wb") as w:
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(rate)
              frames = bytearray()
              for n in range(rate):
                  t = n / rate
                  transient = 0.85 * math.exp(-n / 24.0) if n < 240 else 0.0
                  left = transient + 0.22 * math.sin(2 * math.pi * 63 * t) + 0.08 * math.sin(2 * math.pi * 7200 * t)
                  right = transient * 0.8 + 0.19 * math.sin(2 * math.pi * 63 * t + 0.07) - 0.06 * math.sin(2 * math.pi * 7200 * t)
                  frames.extend(struct.pack("<hh", max(-32768, min(32767, round(left * 22000))), max(-32768, min(32767, round(right * 22000)))))
              w.writeframes(frames)
          '@ | python - $inputWavPath
          & $runner.FullName $plugin.FullName $inputWavPath $outputWavPath
          if ($LASTEXITCODE -ne 0) { throw "VST3 WAV render smoke test failed with exit code $LASTEXITCODE" }
          & $runner.FullName $plugin.FullName $inputWavPath $overrideWavPath --set 'Input=5' --set 'Glue=18' --bool 'Deuce Match=1'
          if ($LASTEXITCODE -ne 0) { throw "VST3 parameter-override render failed with exit code $LASTEXITCODE" }
          @'
          import sys, wave
          with wave.open(sys.argv[1], "rb") as w:
              assert w.getnchannels() == 2, "render must be stereo"
              assert w.getframerate() == 44100, "render sample rate changed"
              assert w.getsampwidth() == 3, "render must be 24-bit PCM"
              assert w.getnframes() > 44100, "render should include the plugin latency/tail"
              print(f"PASS: external WAV VST3 render {w.getframerate()} Hz, {w.getnframes()} frames, {w.getsampwidth()*8}-bit PCM")
          import hashlib, sys, wave
          for path in sys.argv[1:]:
              with wave.open(path, "rb") as w:
                  assert w.getnchannels() == 2 and w.getframerate() == 44100 and w.getsampwidth() == 3
                  assert w.getnframes() > 44100
          hashes = [hashlib.sha256(open(path, "rb").read()).hexdigest() for path in sys.argv[1:]]
          assert hashes[0] != hashes[1], "parameter overrides did not change the rendered audio"
          print("PASS: default and --set override renders are valid, distinct 24-bit stereo WAVs")
          '@ | python - $outputWavPath $overrideWavPath
          $boundaryWavPath = Join-Path $env:RUNNER_TEMP 'skell-master-render-fixture-boundary.wav'
          $invalidRangeWavPath = Join-Path $env:RUNNER_TEMP 'skell-master-render-fixture-invalid-range.wav'
          $invalidStepWavPath = Join-Path $env:RUNNER_TEMP 'skell-master-render-fixture-invalid-step.wav'
          $wrongTypeWavPath = Join-Path $env:RUNNER_TEMP 'skell-master-render-fixture-wrong-type.wav'
          $numericBooleanWavPath = Join-Path $env:RUNNER_TEMP 'skell-master-render-fixture-numeric-boolean.wav'
          & $runner.FullName $plugin.FullName $inputWavPath $boundaryWavPath --set 'Input=18' --set 'Ceiling Adjust=3'
          if ($LASTEXITCODE -ne 0) { throw "Legal upper-bound override was rejected" }
          & $runner.FullName $plugin.FullName $inputWavPath $invalidRangeWavPath --set 'Input=1000'
          if ($LASTEXITCODE -eq 0) { throw "Out-of-range numeric override was silently accepted" }
          if (Test-Path $invalidRangeWavPath) { throw "Rejected range override wrote an output file" }
          & $runner.FullName $plugin.FullName $inputWavPath $invalidStepWavPath --set 'Input=5.5'
          if ($LASTEXITCODE -eq 0) { throw "Illegal stepped value was silently accepted" }
          if (Test-Path $invalidStepWavPath) { throw "Rejected step override wrote an output file" }
          & $runner.FullName $plugin.FullName $inputWavPath $wrongTypeWavPath --bool 'Input=1'
          if ($LASTEXITCODE -eq 0) { throw "Boolean override on a numeric parameter was silently accepted" }
          if (Test-Path $wrongTypeWavPath) { throw "Rejected type override wrote an output file" }
          & $runner.FullName $plugin.FullName $inputWavPath $numericBooleanWavPath --set 'Deuce Match=1'
          if ($LASTEXITCODE -eq 0) { throw "Numeric override on a boolean parameter was silently accepted" }
          if (Test-Path $numericBooleanWavPath) { throw "Rejected boolean-as-numeric override wrote an output file" }
          # The final negative case intentionally leaves a non-zero native exit code.
          # All rejection assertions passed, so do not leak that expected status to pwsh.
          exit 0
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          $runner = Get-ChildItem -Path build -File -Recurse -Filter 'SkellyVST3HostAudioTests.exe' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle missing' }
          if (-not $runner) { throw 'VST3 host render executable missing' }
          $package = Join-Path $PWD 'Skell-Master-Windows-VST3'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -Path $plugin.FullName -Destination $package -Recurse
          Copy-Item -Path $runner.FullName -Destination $package
          Copy-Item -Path 'tools/render_deuce_master_reference.ps1' -Destination $package
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          $prHead = "${{ github.event.pull_request.head.sha || github.sha }}"
          $branchName = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          @"
          Product: Skell Master
          Version: 1.0.0
          Checked-out commit: $checkedOutCommit
          Workflow SHA: $env:GITHUB_SHA
          PR head SHA: $prHead
          Branch: $branchName
          Workflow run: $env:GITHUB_RUN_ID
          VST3 host runner: SkellyVST3HostAudioTests.exe
          Audio render: 24-bit PCM WAV; stereo input; 44.1/48/96 kHz
          Preset: SKELL MASTER (factory identity 5; Deuce Match enabled)
          "@ | Set-Content -Encoding UTF8 (Join-Path $package 'BUILD-INFO.txt')
          @"
          Skell Master — Windows VST3 + offline WAV render helper

          This is a draft verification build, not a production release.

          Render a local stereo WAV through the compiled VST3:
            .\render_deuce_master_reference.ps1 -InputWav "C:\path\deuce w beat.wav" -OutputWav "C:\path\SkellMaster_Deuce_Render.wav"

          Input must be stereo WAV at 44.1, 48 or 96 kHz. Output is 24-bit PCM WAV.
          The runner applies the SKELL MASTER reference parameters and enables Deuce Match.
          Optional overrides: -SetParameter 'Input=5' -SetBoolean 'Deuce Match=1'.
          It includes plugin latency and a short safety tail; align the result before A/B.
          This is a JUCE-hosted VST3 render, not an FL Studio session render.
          No owner audio or preset files are included in this package.
          "@ | Set-Content -Encoding UTF8 (Join-Path $package 'README.txt')
      - name: Validate exact staged VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: Skell-Master-Windows-VST3/Skelly Master.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - uses: actions/upload-artifact@v6
        with:
          retention-days: 14
          name: SkellPlugin-Windows-VST3
          path: Skell-Master-Windows-VST3
          if-no-files-found: error
  reference-audio-linux-renderer:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'test/deuce-vst3-state-roundtrip-20261117' || github.event.pull_request.head.ref == 'test/deuce-master-param-sweep-linux-20261118' || github.event.pull_request.head.ref == 'fix/deuce-override-range-validation-20261118' || github.event.pull_request.head.ref == 'fix/deuce-renderer-ceiling-boundary-20261118')) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install JUCE Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config xvfb libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libxrender-dev libxfixes-dev libxss-dev libgl1-mesa-dev libgtk-3-dev
      - name: Configure Linux VST3 and host renderer
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build Linux VST3 and host renderer
        run: cmake --build build-linux --parallel 4
      - name: Validate Linux VST3 metadata
        shell: bash
        run: |
          set -euo pipefail
          python tools/normalize_vst3_moduleinfo.py --self-test
          plugin="$(find build-linux -type d -name '*.vst3' -print -quit)"
          test -n "$plugin"
          metadata="$plugin/Contents/Resources/moduleinfo.json"
          test -f "$metadata"
          python tools/normalize_vst3_moduleinfo.py "$metadata"
      - name: Run portable DSP and hosted Linux VST3 tests
        run: xvfb-run -a ctest --test-dir build-linux --output-on-failure --verbose
      - name: Smoke-test Linux VST3 parameter override validation
        shell: bash
        run: |
          set -euo pipefail
          plugin="$(find build-linux -type d -name '*.vst3' -print -quit)"
          runner="$(find build-linux -type f -name 'SkellyVST3HostAudioTestsLinux' -perm -111 -print -quit)"
          test -n "$plugin"
          test -n "$runner"
          input="$RUNNER_TEMP/skell-master-range-validation-input.wav"
          default="$RUNNER_TEMP/skell-master-range-validation-default.wav"
          override="$RUNNER_TEMP/skell-master-range-validation-override.wav"
          boundary="$RUNNER_TEMP/skell-master-range-validation-boundary.wav"
          invalid_range="$RUNNER_TEMP/skell-master-range-validation-invalid-range.wav"
          invalid_step="$RUNNER_TEMP/skell-master-range-validation-invalid-step.wav"
          wrong_type="$RUNNER_TEMP/skell-master-range-validation-wrong-type.wav"
          numeric_boolean="$RUNNER_TEMP/skell-master-range-validation-numeric-boolean.wav"
          python - "$input" <<'PY'
          import math, struct, sys, wave
          rate = 44100
          with wave.open(sys.argv[1], "wb") as w:
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(rate)
              frames = bytearray()
              for n in range(rate):
                  t = n / rate
                  left = 0.35 * math.sin(2 * math.pi * 61 * t) + 0.12 * math.sin(2 * math.pi * 7200 * t)
                  right = 0.31 * math.sin(2 * math.pi * 61 * t + 0.07) - 0.09 * math.sin(2 * math.pi * 7200 * t)
                  frames.extend(struct.pack("<hh", round(left * 26000), round(right * 26000)))
              w.writeframes(frames)
          PY
          "$runner" "$plugin" "$input" "$default"
          "$runner" "$plugin" "$input" "$override" --set 'Input=5' --set 'Glue=18' --bool 'Deuce Match=1'
          "$runner" "$plugin" "$input" "$boundary" --set 'Input=18' --set 'Ceiling Adjust=3'
          if "$runner" "$plugin" "$input" "$invalid_range" --set 'Input=1000'; then
            echo "Out-of-range numeric override was silently accepted" >&2
            exit 1
          fi
          test ! -e "$invalid_range"
          if "$runner" "$plugin" "$input" "$invalid_step" --set 'Input=5.5'; then
            echo "Illegal stepped value was silently accepted" >&2
            exit 1
          fi
          test ! -e "$invalid_step"
          if "$runner" "$plugin" "$input" "$wrong_type" --bool 'Input=1'; then
            echo "Boolean override on a numeric parameter was silently accepted" >&2
            exit 1
          fi
          test ! -e "$wrong_type"
          if "$runner" "$plugin" "$input" "$numeric_boolean" --set 'Deuce Match=1'; then
            echo "Numeric override on a boolean parameter was silently accepted" >&2
            exit 1
          fi
          test ! -e "$numeric_boolean"
          python - "$default" "$override" "$boundary" <<'PY'
          import hashlib, sys, wave
          hashes = []
          for path in sys.argv[1:]:
              with wave.open(path, "rb") as w:
                  assert w.getnchannels() == 2 and w.getframerate() == 44100 and w.getsampwidth() == 3
                  assert w.getnframes() > 44100
              hashes.append(hashlib.sha256(open(path, "rb").read()).hexdigest())
          assert len(set(hashes)) == 3, "legal overrides must produce distinct rendered audio"
          print("PASS: Linux VST3 valid, boundary, range, step and boolean override checks")
          PY
      - name: Package local-reference renderer
        shell: bash
        run: |
          set -euo pipefail
          plugin="$(find build-linux -type d -name '*.vst3' -print -quit)"
          runner="$(find build-linux -type f -name 'SkellyVST3HostAudioTestsLinux' -perm -111 -print -quit)"
          test -n "$plugin"
          test -n "$runner"
          package=Skell-Master-Linux-VST3
          mkdir -p "$package"
          cp -a "$plugin" "$package/"
          cp "$runner" "$package/"
          cp tools/render_deuce_master_reference.sh "$package/"
          chmod +x "$package/render_deuce_master_reference.sh"
          plugin_binary="$(find "$plugin" -type f -name '*.so' -print -quit)"
          test -n "$plugin_binary"
          ldd "$runner" | tee "$package/ldd-runner.txt"
          ldd "$plugin_binary" | tee "$package/ldd-plugin.txt"
          if grep -q 'not found' "$package/ldd-runner.txt" "$package/ldd-plugin.txt"; then
            echo 'Missing Linux runtime dependency' >&2
            exit 1
          fi
          {
            echo "Product: Skell Master"
            echo "Checked-out commit: $(git rev-parse HEAD)"
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Host runner: SkellyVST3HostAudioTestsLinux"
            echo "Preset: SKELL MASTER (factory identity 5; Deuce Match enabled)"
            echo "Output: 24-bit PCM WAV; includes reported latency and safety tail"
            echo "Private owner WAV/FST files: not included or uploaded"
          } > "$package/BUILD-INFO.txt"
          cat > "$package/README.txt" <<'EOF'
          Skell Master — Linux VST3 reference renderer

          This is a render/analysis helper, not a Windows release or FL Studio session.

          Render a local stereo WAV through the compiled VST3:
            ./render_deuce_master_reference.sh "./Skelly Master.vst3" "/path/input.wav" "/path/output.wav"

          Input must be stereo WAV at 44.1, 48 or 96 kHz. Output is 24-bit PCM WAV.
          The runner applies the SKELL MASTER factory parameters and enables Deuce Match.
          Optional overrides: --set 'Input=5' --bool 'Deuce Match=1'.
          The output includes reported plugin latency and a short tail; align before A/B.
          The script refuses to overwrite an existing output file.
          Owner audio and FST files are never included in this package.
          EOF
      - uses: actions/upload-artifact@v6
        with:
          retention-days: 14
          name: SkellMaster-Linux-VST3-ReferenceRenderer
          path: Skell-Master-Linux-VST3
          if-no-files-found: error
